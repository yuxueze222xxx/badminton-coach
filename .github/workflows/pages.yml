name: Build and deploy PWA

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          set -e
          mkdir -p site/icons
          curl -fsSL --retry 3 'https://4mhehbwjksczy.doubao.link/app/app_17jjufcb42n/' -o site/index.html
          cp manifest.json site/manifest.json
          cp icon.svg site/icon.svg
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 icon.svg -o site/icons/icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o site/icons/icon-512.png
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
